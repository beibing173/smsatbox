; ============================================================================
;  SMSATBOX · ESP32 固件构建配置
;  平台：ESP32-S3 (N16R8 —— 16MB Flash + 8MB PSRAM)
;  框架：Arduino
;  版本：v1.0.0
;
;  编译：pio run
;  上传：pio run -t upload
;  串口：pio device monitor -b 115200
;  产物：.pio/build/smsatbox/firmware.bin  （上传到 Server 做 OTA）
;
;  兼容：board=esp32-s3-devkitc-1 默认是 8MB/无 PSRAM 的变体，
;        这里通过 board_build.* 显式覆盖为 N16R8 规格，
;        真正的 16MB + 8MB PSRAM 由 esp32-s3-devkitc-1 的通用定义 +
;        下面的 flash/psram 参数共同决定。
; ============================================================================
[env:smsatbox]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino

; ---------------- 硬件：N16R8 ----------------
board_build.mcu = esp32s3
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.flash_size = 16MB
board_build.psram_type = opi
board_build.partitions = partitions.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 4194304
board_build.arduino.memory_type = qio_opi

; ---------------- 编译选项 ----------------
build_flags =
    -DCORE_DEBUG_LEVEL=2
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DSMSATBOX_VERSION_STR=\"1.0.0\"
    -ffunction-sections
    -fdata-sections

build_unflags = -std=gnu++11
build_src_flags = -std=gnu++17

; ---------------- 依赖库 ----------------
lib_deps =
    bblanchon/ArduinoJson@^7.2.1
    links2004/WebSockets@^2.6.1

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
upload_speed = 921600

; 自定义分区表，见 partitions.csv（双 OTA 分区，各 4MB）
