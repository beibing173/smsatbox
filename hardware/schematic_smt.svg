<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="2100" height="1560" viewBox="0 0 2100 1560">
  <style>
    .bg { fill: #fbfcfe; }
    .blk { fill: #ffffff; stroke: #2b4a6f; stroke-width: 2; }
    .title { font: 700 24px "Microsoft YaHei", sans-serif; fill: #12243a; }
    .sub { font: 400 13px "Microsoft YaHei", sans-serif; fill: #5a7186; }
    .h2 { font: 700 16px "Microsoft YaHei", sans-serif; fill: #12243a; }
    .h3 { font: 700 13px "Microsoft YaHei", sans-serif; fill: #1a4a7a; }
    .pin { font: 400 11.5px "Consolas", monospace; fill: #24384f; }
    .pinlbl { font: 400 10.5px "Microsoft YaHei", sans-serif; fill: #5a7186; }
    .part { font: 700 11px "Consolas", monospace; fill: #b3261e; }
    .wire-pwr { stroke: #d93025; stroke-width: 3; fill: none; }
    .wire-sig { stroke: #1f6feb; stroke-width: 2; fill: none; }
    .wire-sim { stroke: #e37400; stroke-width: 2; fill: none; }
    .wire-gnd { stroke: #2b3138; stroke-width: 2.6; fill: none; }
    .dot-pwr { fill: #d93025; }
    .note { font: 400 11px "Microsoft YaHei", sans-serif; fill: #8a6d3b; }
    .chip { fill: #fdf6e3; stroke: #b3261e; stroke-width: 1.8; }
    .chip2 { fill: #eef4fb; stroke: #2b4a6f; stroke-width: 1.6; }
  </style>

  <rect class="bg" width="2100" height="1560"/>

  <text x="40" y="48" class="title">SMSATBOX 贴片底板 · 原理图 v1.0.6（SMT 量产版）</text>
  <text x="40" y="74" class="sub">
    ESP32-S3-WROOM-1-N16R8 + 2× ML307A (DSLN/GFLN) + SY8205 5A 降压 + MP2315 3A 降压 + CH340C · USB-C 供电
  </text>

  <!-- ============================ ① 电源输入 ============================ -->
  <rect x="40" y="96" width="400" height="330" rx="8" class="blk"/>
  <text x="58" y="124" class="h2">① 电源输入与保护</text>

  <!-- USB-C -->
  <rect x="62" y="146" width="140" height="64" rx="5" class="chip2"/>
  <text x="132" y="170" text-anchor="middle" class="h3">J1 USB-C</text>
  <text x="132" y="188" text-anchor="middle" class="pinlbl">16P 母座</text>
  <text x="132" y="203" text-anchor="middle" class="part">Type-C SMD</text>

  <!-- 保险丝 -->
  <rect x="62" y="230" width="140" height="46" rx="5" class="chip2"/>
  <text x="132" y="250" text-anchor="middle" class="h3">F1 保险丝</text>
  <text x="132" y="267" text-anchor="middle" class="part">2A 1206</text>

  <!-- TVS -->
  <rect x="62" y="296" width="140" height="46" rx="5" class="chip2"/>
  <text x="132" y="316" text-anchor="middle" class="h3">D2 TVS</text>
  <text x="132" y="333" text-anchor="middle" class="part">SMBJ5.0A SMB</text>

  <!-- 防反接 -->
  <rect x="62" y="362" width="140" height="46" rx="5" class="chip2"/>
  <text x="132" y="382" text-anchor="middle" class="h3">D1 防反接</text>
  <text x="132" y="399" text-anchor="middle" class="part">SS14 SMA</text>

  <!-- 输入电容 -->
  <rect x="242" y="146" width="176" height="76" rx="5" class="chip2"/>
  <text x="330" y="168" text-anchor="middle" class="h3">输入滤波</text>
  <text x="330" y="188" text-anchor="middle" class="part">C1,C2 22µF 0805</text>
  <text x="330" y="206" text-anchor="middle" class="pinlbl">5V 输入储能</text>

  <!-- CC 电阻 -->
  <rect x="242" y="238" width="176" height="60" rx="5" class="chip2"/>
  <text x="330" y="260" text-anchor="middle" class="h3">CC 识别</text>
  <text x="330" y="280" text-anchor="middle" class="part">R7,R8 5.1kΩ 0402</text>

  <!-- 5V 节点 -->
  <circle cx="202" cy="430" r="6" class="dot-pwr"/>
  <text x="202" y="456" text-anchor="middle" class="pin">+5V</text>

  <path class="wire-pwr" d="M202 210 V230"/>
  <path class="wire-pwr" d="M202 276 V296"/>
  <path class="wire-pwr" d="M202 342 V362"/>
  <path class="wire-pwr" d="M202 408 V430"/>
  <path class="wire-pwr" d="M132 210 H202"/>
  <path class="wire-pwr" d="M202 168 H242 V184 H242  M330 222 V238"/>

  <text x="62" y="490" class="note">5V 输入建议 ≥ 3A 适配器</text>
  <text x="62" y="508" class="note">峰值瞬时由 C1/C2 补充</text>

  <!-- ============================ ② 3.8V 降压 ============================ -->
  <rect x="470" y="96" width="420" height="330" rx="8" class="blk"/>
  <text x="488" y="124" class="h2">② U1 SY8205 5A 同步降压 → 3.8V</text>
  <text x="488" y="144" class="sub">供两路 ML307A 模组（发射峰值 2A×2）</text>

  <rect x="492" y="162" width="200" height="150" rx="6" class="chip"/>
  <text x="592" y="186" text-anchor="middle" class="h3">U1 SY8205FCC</text>
  <text x="592" y="206" text-anchor="middle" class="part">SOIC-8-EP</text>
  <text x="592" y="230" text-anchor="middle" class="pinlbl">5V → 3.8V @ 5A</text>
  <text x="592" y="250" text-anchor="middle" class="pinlbl">开关频率 500kHz</text>
  <text x="592" y="276" text-anchor="middle" class="pinlbl">EPAD 必须铺铜打满过孔</text>
  <text x="592" y="296" text-anchor="middle" class="pinlbl">热阻要求高</text>

  <!-- 电感 -->
  <rect x="716" y="162" width="150" height="60" rx="5" class="chip2"/>
  <text x="791" y="184" text-anchor="middle" class="h3">L1 电感</text>
  <text x="791" y="202" text-anchor="middle" class="part">4.7µH / 6A</text>
  <text x="791" y="217" text-anchor="middle" class="pinlbl">CD54 或 一体成型</text>

  <!-- 分压 -->
  <rect x="716" y="240" width="150" height="72" rx="5" class="chip2"/>
  <text x="791" y="262" text-anchor="middle" class="h3">反馈分压</text>
  <text x="791" y="282" text-anchor="middle" class="part">R1 62kΩ 0402</text>
  <text x="791" y="300" text-anchor="middle" class="part">R2 11.5kΩ 0402</text>

  <!-- 输出电容 -->
  <rect x="492" y="328" width="200" height="60" rx="5" class="chip2"/>
  <text x="592" y="350" text-anchor="middle" class="h3">输出滤波</text>
  <text x="592" y="370" text-anchor="middle" class="part">C3,C4 22µF/6.3V 0805</text>

  <!-- 3.8V 节点 -->
  <circle cx="592" cy="404" r="6" class="dot-pwr"/>
  <text x="592" y="428" text-anchor="middle" class="pin">+3.8V (VBAT)</text>

  <path class="wire-pwr" d="M202 430 H470 V404 H592"/>
  <path class="wire-pwr" d="M692 200 H716"/>
  <path class="wire-pwr" d="M791 222 V240"/>
  <path class="wire-pwr" d="M791 312 V318 H692 V240"/>
  <path class="wire-pwr" d="M592 312 V328"/>

  <!-- ============================ ③ 3.3V 降压 ============================ -->
  <rect x="910" y="96" width="400" height="330" rx="8" class="blk"/>
  <text x="928" y="124" class="h2">③ U2 MP2315 3A 降压 → 3.3V</text>
  <text x="928" y="144" class="sub">供 ESP32-S3 与全部逻辑</text>

  <rect x="932" y="162" width="190" height="130" rx="6" class="chip"/>
  <text x="1027" y="186" text-anchor="middle" class="h3">U2 MP2315GJ</text>
  <text x="1027" y="206" text-anchor="middle" class="part">TSOT23-8</text>
  <text x="1027" y="230" text-anchor="middle" class="pinlbl">5V → 3.3V @ 3A</text>
  <text x="1027" y="250" text-anchor="middle" class="pinlbl">开关频率 500kHz</text>
  <text x="1027" y="274" text-anchor="middle" class="pinlbl">体积小，适合副路</text>

  <rect x="1140" y="162" width="150" height="56" rx="5" class="chip2"/>
  <text x="1215" y="184" text-anchor="middle" class="h3">L2 电感</text>
  <text x="1215" y="202" text-anchor="middle" class="part">4.7µH / 2A</text>
  <text x="1215" y="217" text-anchor="middle" class="pinlbl">CD43</text>

  <rect x="1140" y="232" width="150" height="72" rx="5" class="chip2"/>
  <text x="1215" y="254" text-anchor="middle" class="h3">反馈分压</text>
  <text x="1215" y="274" text-anchor="middle" class="part">R3 47kΩ 0402</text>
  <text x="1215" y="292" text-anchor="middle" class="part">R4 15kΩ 0402</text>

  <rect x="932" y="308" width="190" height="60" rx="5" class="chip2"/>
  <text x="1027" y="330" text-anchor="middle" class="h3">输出滤波</text>
  <text x="1027" y="350" text-anchor="middle" class="part">C7,C8 22µF/6.3V 0805</text>

  <circle cx="1027" cy="386" r="6" class="dot-pwr"/>
  <text x="1027" y="410" text-anchor="middle" class="pin">+3.3V</text>

  <path class="wire-pwr" d="M202 430 H910 V386 H1027"/>
  <path class="wire-pwr" d="M1122 200 H1140"/>
  <path class="wire-pwr" d="M1215 218 V232"/>
  <path class="wire-pwr" d="M1215 304 V310 H1122 V240"/>
  <path class="wire-pwr" d="M1027 292 V308"/>

  <!-- ============================ ④ ESP32 ============================ -->
  <rect x="40" y="446" width="560" height="600" rx="8" class="blk"/>
  <text x="58" y="474" class="h2">④ ESP32-S3-WROOM-1-N16R8 主控</text>
  <text x="58" y="494" class="sub">25.5 × 18 × 3.1mm · 16MB Flash + 8MB PSRAM</text>

  <rect x="70" y="512" width="240" height="380" rx="6" class="chip"/>
  <text x="190" y="540" text-anchor="middle" class="h3">U3 ESP32-S3-WROOM-1</text>
  <text x="190" y="560" text-anchor="middle" class="part">SMD-44 (含 EPAD)</text>
  <text x="190" y="590" text-anchor="middle" class="pinlbl">3V3 / GND</text>
  <text x="190" y="612" text-anchor="middle" class="pinlbl">UART0 (下载调试)</text>
  <text x="190" y="634" text-anchor="middle" class="pinlbl">GPIO ×多种</text>
  <text x="190" y="656" text-anchor="middle" class="pinlbl">USB D+/D- (GPIO19/20)</text>
  <text x="190" y="690" text-anchor="middle" class="pinlbl">天线净空区</text>
  <text x="190" y="712" text-anchor="middle" class="pinlbl">禁止铺铜/放件 15mm</text>

  <!-- 去耦 -->
  <rect x="330" y="512" width="250" height="80" rx="5" class="chip2"/>
  <text x="455" y="534" text-anchor="middle" class="h3">去耦网络</text>
  <text x="455" y="556" text-anchor="middle" class="part">C10 100nF×3 0402</text>
  <text x="455" y="574" text-anchor="middle" class="part">C11 10µF 0805</text>

  <!-- 复位 -->
  <rect x="330" y="606" width="250" height="80" rx="5" class="chip2"/>
  <text x="455" y="628" text-anchor="middle" class="h3">复位 / 启动</text>
  <text x="455" y="650" text-anchor="middle" class="part">R5,R6 10kΩ 0402</text>
  <text x="455" y="668" text-anchor="middle" class="part">C12 1µF 0402</text>

  <!-- 自动下载 -->
  <rect x="330" y="700" width="250" height="96" rx="5" class="chip2"/>
  <text x="455" y="722" text-anchor="middle" class="h3">自动下载电路</text>
  <text x="455" y="744" text-anchor="middle" class="part">Q1,Q2 S8050 SOT-23</text>
  <text x="455" y="762" text-anchor="middle" class="pinlbl">DTR/RTS 控 EN/IO0</text>
  <text x="455" y="782" text-anchor="middle" class="part">SW1,SW2 轻触 3×4mm</text>

  <path class="wire-pwr" d="M1027 386 V470 H190"/>

  <text x="58" y="920" class="note">引脚分配与固件 config.h 一致</text>
  <text x="58" y="940" class="note">GPIO17/18 → 模组1，GPIO9/10 → 模组2</text>
  <text x="58" y="960" class="note">GPIO16 → 模组1 PWRKEY，GPIO21 → 模组2 PWRKEY</text>
  <text x="58" y="980" class="note">GPIO48 → WS2812 状态灯（可选）</text>
  <text x="58" y="1000" class="note">GPIO4 → 运行指示灯</text>

  <!-- ============================ ⑤ CH340C ============================ -->
  <rect x="40" y="1064" width="560" height="250" rx="8" class="blk"/>
  <text x="58" y="1092" class="h2">⑤ USB 转串口（CH340C 免晶振）</text>

  <rect x="70" y="1110" width="200" height="120" rx="6" class="chip"/>
  <text x="170" y="1134" text-anchor="middle" class="h3">U4 CH340C</text>
  <text x="170" y="1154" text-anchor="middle" class="part">SOP-16</text>
  <text x="170" y="1180" text-anchor="middle" class="pinlbl">USB → UART</text>
  <text x="170" y="1200" text-anchor="middle" class="pinlbl">内置晶振</text>
  <text x="170" y="1220" text-anchor="middle" class="pinlbl">免外部晶体</text>

  <rect x="300" y="1110" width="280" height="120" rx="5" class="chip2"/>
  <text x="440" y="1134" text-anchor="middle" class="h3">连接</text>
  <text x="440" y="1158" class="pin">R9,R10 22Ω → D+/D-</text>
  <text x="440" y="1180" class="pin">TXD → ESP32 GPIO44(U0RXD)</text>
  <text x="440" y="1202" class="pin">RXD ← ESP32 GPIO43(U0TXD)</text>
  <text x="440" y="1224" class="pin">DTR/RTS → 自动下载电路</text>

  <path class="wire-sig" d="M132 210 H170 V1110"/>

  <!-- ============================ ⑥ 模组 1 ============================ -->
  <rect x="640" y="446" width="620" height="330" rx="8" class="blk"/>
  <text x="658" y="474" class="h2">⑥ ML307A 模组 1（卡槽 1）</text>
  <text x="658" y="494" class="sub">LCC44 + LGA50 · 17.7 × 15.8 × 2.4mm</text>

  <rect x="660" y="512" width="180" height="180" rx="6" class="chip"/>
  <text x="750" y="538" text-anchor="middle" class="h3">U5 ML307A</text>
  <text x="750" y="558" text-anchor="middle" class="part">LCC44+LGA50</text>
  <text x="750" y="586" text-anchor="middle" class="pinlbl">LTE Cat.1</text>
  <text x="750" y="608" text-anchor="middle" class="pinlbl">VBAT ×4</text>
  <text x="750" y="630" text-anchor="middle" class="pinlbl">GND ×多</text>
  <text x="750" y="652" text-anchor="middle" class="pinlbl">UART / SIM</text>
  <text x="750" y="674" text-anchor="middle" class="pinlbl">ANT_MAIN</text>

  <!-- 储能 -->
  <rect x="864" y="512" width="180" height="86" rx="5" class="chip2"/>
  <text x="954" y="534" text-anchor="middle" class="h3">VBAT 储能</text>
  <text x="954" y="556" text-anchor="middle" class="part">C20 100µF 3528</text>
  <text x="954" y="574" text-anchor="middle" class="part">C22 1µF 0603</text>
  <text x="954" y="590" text-anchor="middle" class="part">C23 100nF×2 0402</text>

  <!-- SIM -->
  <rect x="1068" y="512" width="170" height="76" rx="5" class="chip2"/>
  <text x="1153" y="534" text-anchor="middle" class="h3">J2 SIM1</text>
  <text x="1153" y="556" text-anchor="middle" class="part">Nano 推拉式 SMD</text>
  <text x="1153" y="576" text-anchor="middle" class="part">R11,R12 4.7kΩ</text>

  <!-- 天线 -->
  <rect x="1068" y="602" width="170" height="66" rx="5" class="chip2"/>
  <text x="1153" y="624" text-anchor="middle" class="h3">J3 IPEX</text>
  <text x="1153" y="646" text-anchor="middle" class="part">U.FL SMD</text>
  <text x="1153" y="662" text-anchor="middle" class="pinlbl">50Ω + π 匹配</text>

  <!-- PWRKEY -->
  <rect x="864" y="612" width="180" height="76" rx="5" class="chip2"/>
  <text x="954" y="634" text-anchor="middle" class="h3">PWRKEY 驱动</text>
  <text x="954" y="656" text-anchor="middle" class="part">T1 2N7002 SOT-23</text>
  <text x="954" y="674" text-anchor="middle" class="part">R14 10kΩ 下拉</text>

  <path class="wire-pwr" d="M592 404 V470 H660"/>
  <path class="wire-sim" d="M840 550 H864"/>
  <path class="wire-sim" d="M840 620 H1068"/>

  <text x="658" y="754" class="note">EPAD 下方开 9×9 散热过孔阵列（0.3mm）</text>
  <text x="658" y="772" class="note">VBAT 走线 ≥ 2mm，独立从 DC-DC 拉出</text>

  <!-- ============================ ⑦ 模组 2 ============================ -->
  <rect x="640" y="800" width="620" height="330" rx="8" class="blk"/>
  <text x="658" y="828" class="h2">⑦ ML307A 模组 2（卡槽 2）</text>
  <text x="658" y="848" class="sub">与模组 1 完全对称，元件位号 +10</text>

  <rect x="660" y="866" width="180" height="180" rx="6" class="chip"/>
  <text x="750" y="892" text-anchor="middle" class="h3">U6 ML307A</text>
  <text x="750" y="912" text-anchor="middle" class="part">LCC44+LGA50</text>
  <text x="750" y="940" text-anchor="middle" class="pinlbl">LTE Cat.1</text>
  <text x="750" y="962" text-anchor="middle" class="pinlbl">VBAT ×4</text>
  <text x="750" y="984" text-anchor="middle" class="pinlbl">GND ×多</text>
  <text x="750" y="1006" text-anchor="middle" class="pinlbl">UART / SIM</text>
  <text x="750" y="1028" text-anchor="middle" class="pinlbl">ANT_MAIN</text>

  <rect x="864" y="866" width="180" height="86" rx="5" class="chip2"/>
  <text x="954" y="888" text-anchor="middle" class="h3">VBAT 储能</text>
  <text x="954" y="910" text-anchor="middle" class="part">C30 100µF 3528</text>
  <text x="954" y="928" text-anchor="middle" class="part">C32 1µF 0603</text>
  <text x="954" y="944" text-anchor="middle" class="part">C33 100nF×2 0402</text>

  <rect x="1068" y="866" width="170" height="76" rx="5" class="chip2"/>
  <text x="1153" y="888" text-anchor="middle" class="h3">J5 SIM2</text>
  <text x="1153" y="910" text-anchor="middle" class="part">Nano 推拉式 SMD</text>
  <text x="1153" y="930" text-anchor="middle" class="part">R21,R22 4.7kΩ</text>

  <rect x="1068" y="956" width="170" height="66" rx="5" class="chip2"/>
  <text x="1153" y="978" text-anchor="middle" class="h3">J6 IPEX</text>
  <text x="1153" y="1000" text-anchor="middle" class="part">U.FL SMD</text>
  <text x="1153" y="1016" text-anchor="middle" class="pinlbl">50Ω + π 匹配</text>

  <rect x="864" y="966" width="180" height="76" rx="5" class="chip2"/>
  <text x="954" y="988" text-anchor="middle" class="h3">PWRKEY 驱动</text>
  <text x="954" y="1010" text-anchor="middle" class="part">T2 2N7002 SOT-23</text>
  <text x="954" y="1028" text-anchor="middle" class="part">R24 10kΩ 下拉</text>

  <path class="wire-pwr" d="M592 404 V520 H640 V866 H660"/>
  <path class="wire-sim" d="M840 904 H864"/>
  <path class="wire-sim" d="M840 974 H1068"/>

  <text x="658" y="1108" class="note">两路 VBAT 各自独立粗线，禁止串联</text>

  <!-- ============================ ⑧ 指示灯 ============================ -->
  <rect x="1290" y="446" width="380" height="330" rx="8" class="blk"/>
  <text x="1308" y="474" class="h2">⑧ 指示灯与调试口</text>

  <g class="pin">
    <text x="1308" y="508">D4 电源灯(红) 5V → R15 1kΩ → LED → GND</text>
    <text x="1308" y="534">D5 运行灯(蓝) GPIO4 → R16 470Ω → LED</text>
    <text x="1308" y="560">D3 4G1 灯  NETLIGHT → R17 1kΩ → LED</text>
    <text x="1308" y="586">D6 WS2812 GPIO48（可选，5050）</text>
  </g>

  <text x="1308" y="624" class="h3">调试口 J4</text>
  <g class="pin">
    <text x="1308" y="650">4pin 2.54mm：3V3 / TX / RX / GND</text>
  </g>

  <text x="1308" y="690" class="h3">测试点</text>
  <g class="pin">
    <text x="1308" y="714">TP1 = 5V   TP2 = 3.8V</text>
    <text x="1308" y="736">TP3 = 3.3V TP4 = GND</text>
  </g>

  <text x="1308" y="770" class="note">测试点用 1.5mm 裸焊盘</text>

  <!-- ============================ ⑨ 设计约束 ============================ -->
  <rect x="1290" y="800" width="770" height="514" rx="8" class="blk"/>
  <text x="1308" y="828" class="h2">⑨ 打样前必读：关键设计约束</text>

  <text x="1308" y="862" class="h3">电源</text>
  <g class="pinlbl">
    <text x="1308" y="886">1. SY8205 的 EPAD 必须打满过孔接 GND，散热不够会烧芯片。</text>
    <text x="1308" y="908">2. 两路 VBAT 各走一条 ≥ 2mm 独立粗线，从 DC-DC 输出端分开拉。</text>
    <text x="1308" y="930">3. 每个模组 VBAT 旁必须 100µF 储能，距离 ≤ 3mm。</text>
    <text x="1308" y="952">4. 发射峰值 2A，压降必须 &lt; 200mV，否则模组掉电重启。</text>
  </g>

  <text x="1308" y="986" class="h3">射频</text>
  <g class="pinlbl">
    <text x="1308" y="1010">5. 天线走线 50Ω 阻抗控制（4 层用 L1 参考 L2）。</text>
    <text x="1308" y="1032">6. IPEX 到 ANT 引脚 ≤ 8mm，两侧包地过孔。</text>
    <text x="1308" y="1054">7. 天线座旁留 π 型匹配焊盘（串 0Ω + 对地 NC）。</text>
  </g>

  <text x="1308" y="1088" class="h3">SIM 与布局</text>
  <g class="pinlbl">
    <text x="1308" y="1112">8. SIM 四线 ≤ 50mm，等长，DATA 上拉 4.7kΩ。</text>
    <text x="1308" y="1134">9. DC-DC 电感远离天线 ≥ 15mm。</text>
    <text x="1308" y="1156">10. ESP32 天线端 15mm 净空，禁铺铜禁放件。</text>
    <text x="1308" y="1178">11. 模组正下方开 9×9 散热过孔阵列（0.3mm）。</text>
    <text x="1308" y="1200">12. 建议 4 层板 TOP/GND/PWR/BOTTOM，GND 完整。</text>
  </g>

  <text x="1308" y="1240" class="h3">打样</text>
  <g class="pinlbl">
    <text x="1308" y="1264">13. 首版打 5 片，先只焊电源验证电压，再焊模组。</text>
    <text x="1308" y="1286">14. ML307A 是 LGA 封装，必须回流焊，手工烙铁焊不了。</text>
  </g>

  <text x="40" y="1400" class="sub">SMSATBOX Hardware · SMT 量产版 v1.0.6 · 2026-11-08</text>
  <text x="40" y="1424" class="sub">配套：BOM.md（可下单物料表）· case.scad（3D 外壳）· 使用说明.md</text>

  <!-- 板框标注 -->
  <rect x="1660" y="1340" width="400" height="110" rx="6" fill="#fff" stroke="#2b4a6f" stroke-width="1.6"/>
  <text x="1678" y="1366" class="h3">板框尺寸</text>
  <text x="1678" y="1390" class="pin">PCB: 120 × 90 × 1.6mm</text>
  <text x="1678" y="1412" class="pin">M3 孔: 距边 5mm</text>
  <text x="1678" y="1434" class="pin">外壳: 125 × 95 × 34mm</text>
</svg>
