# ==============================================================================
# SMSATBOX Server · docker compose 部署
#
#   【推荐】直接用 Docker Hub 上的现成镜像：
#     cp .env.example .env       # 修改 ADMIN_PASSWORD / SECRET_KEY
#     docker compose pull
#     docker compose up -d
#
#   【从源码构建】修改了代码想本地编译时用：
#     docker compose up -d --build
#
#   升级到最新版：
#     docker compose pull && docker compose up -d
#
#   镜像：beibing173/smsatbox-server
#     标签 latest / 1.0.0 / 1.0 / sha-xxxxxxx
# ==============================================================================
services:
  server:
    image: beibing173/smsatbox-server:${IMAGE_TAG:-latest}
    build:
      # 仅当显式指定 --build 时才会用到；平时 compose pull 直接用镜像
      context: .
      dockerfile: Dockerfile
    container_name: smsatbox-server
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:8080"
    environment:
      # ---- 容器内路径与区域 ----
      DATA_DIR: /data
      TZ: Asia/Shanghai
      # ---- 安全：务必通过 .env 覆盖 ----
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin@123456}
      ADMIN_DISPLAY_NAME: ${ADMIN_DISPLAY_NAME:-超级管理员}
      SECRET_KEY: ${SECRET_KEY:-}
      TOKEN_TTL_MINUTES: ${TOKEN_TTL_MINUTES:-720}
      # ---- 服务 ----
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      DEVICE_OFFLINE_SECONDS: ${DEVICE_OFFLINE_SECONDS:-90}
      MAX_FIRMWARE_MB: ${MAX_FIRMWARE_MB:-16}
      # ---- 维度二：协同升级 ----
      # ESP32 检测到 Server 版本落后时，可请求拉取最新镜像并重启
      SERVER_IMAGE: ${SERVER_IMAGE:-beibing173/smsatbox-server}
      SERVER_UPGRADE_ENABLED: ${SERVER_UPGRADE_ENABLED:-false}
      SERVER_UPGRADE_COMMAND: ${SERVER_UPGRADE_COMMAND:-}
    volumes:
      # SQLite 数据库 + 固件文件持久化，重建容器不丢数据
      - smsatbox-data:/data
      # 若要让 ESP32 触发 Server 自升级，需放开下面这行并设 SERVER_UPGRADE_ENABLED=true
      # 注意：挂载 docker.sock 等于给予容器宿主机 root 级控制权，请自行评估
      # - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  smsatbox-data:
    driver: local
