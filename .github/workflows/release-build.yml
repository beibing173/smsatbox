name: Build & Release

# ============================================================================
#  SMSATBOX · 维度一：外部用户端发布（APK & EXE）
# ----------------------------------------------------------------------------
#  【版本模型】APK 与 EXE 各自独立版本号，但共用**同一个 Release**。
#
#    - 各端版本号来源：versions/android.txt、versions/windows.txt
#    - Release tag：按日期编号（如 v2026.11.07、v2026.11.07-2），
#      只作为「这一次发布了什么」的统一标识，不代表任何一端的版本。
#    - 产物命名带平台与版本：
#        smsatbox-android-1.2.0.apk
#        smsatbox-windows-1.0.5.exe
#    - 客户端升级时只比对「自己那个文件名里的版本」，
#      所以 Android 1.2.0 发布不会让 Windows 误以为自己要升级。
#
#  【版本覆盖规则】同 tag 的 Release 已存在 → 覆盖附件；不存在 → 新建。
#  【注意】ESP32 固件不参与本流水线。
# ============================================================================

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      force_recreate:
        description: "强制重建 Release（即使同 tag 已存在）"
        required: false
        type: boolean
        default: false
      snapshot_tag:
        description: "自定义 Release tag（留空则自动生成日期快照号）"
        required: false
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ═══════════════════════════════════════════════════════════════
  # 1. 读取各端版本号，决定 Release tag 与发布策略
  # ═══════════════════════════════════════════════════════════════
  prepare:
    name: 读取版本号
    runs-on: ubuntu-latest
    outputs:
      android_version: ${{ steps.ver.outputs.android_version }}
      android_code: ${{ steps.ver.outputs.android_code }}
      windows_version: ${{ steps.ver.outputs.windows_version }}
      server_version: ${{ steps.ver.outputs.server_version }}
      tag: ${{ steps.ver.outputs.tag }}
      strategy: ${{ steps.decide.outputs.strategy }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 读取三端版本号
        id: ver
        run: |
          chmod +x scripts/version.sh
          bash scripts/version.sh validate-all

          AV="$(bash scripts/version.sh android name)"
          AC="$(bash scripts/version.sh android code)"
          WV="$(bash scripts/version.sh windows name)"
          SV="$(bash scripts/version.sh server name)"

          # tag 取手动输入 > push 的 tag > 自动快照号
          CUSTOM="${{ github.event.inputs.snapshot_tag }}"
          if [ -n "$CUSTOM" ]; then
            TAG="$CUSTOM"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="v$(bash scripts/version.sh snapshot)"
          fi

          echo "android_version=$AV" >> "$GITHUB_OUTPUT"
          echo "android_code=$AC"    >> "$GITHUB_OUTPUT"
          echo "windows_version=$WV" >> "$GITHUB_OUTPUT"
          echo "server_version=$SV"  >> "$GITHUB_OUTPUT"
          echo "tag=$TAG"            >> "$GITHUB_OUTPUT"

          echo "Android : v$AC ($AV)"
          echo "Windows : $WV"
          echo "Server  : $SV"
          echo "Release tag : $TAG"

      - name: 检查该 tag 的 Release 是否已存在
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Release $TAG 已存在，将覆盖附件"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Release $TAG 不存在，将新建"
          fi

      - name: 决定发布策略
        id: decide
        run: |
          if [ "${{ steps.check.outputs.exists }}" = "true" ]; then
            echo "strategy=overwrite" >> "$GITHUB_OUTPUT"
            echo "::notice::策略: 覆盖 ${{ steps.ver.outputs.tag }}"
          else
            echo "strategy=create" >> "$GITHUB_OUTPUT"
            echo "::notice::策略: 新建 ${{ steps.ver.outputs.tag }}"
          fi

  # ═══════════════════════════════════════════════════════════════
  # 2. 构建 Android APK
  # ═══════════════════════════════════════════════════════════════
  build-apk:
    name: 构建 APK
    runs-on: ubuntu-latest
    needs: prepare
    steps:
      - uses: actions/checkout@v4

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 准备 Android SDK
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          SDKMGR="$(ls -1 "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -n1)"
          if [ -n "$SDKMGR" ]; then
            yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
            "$SDKMGR" "platforms;android-34" "build-tools;34.0.0" > /dev/null 2>&1 || \
              echo "::warning::SDK 组件安装有警告，继续构建"
          fi
          ls "$SDK/platforms" 2>/dev/null || true

      - name: 同步版本号到源码
        run: |
          chmod +x scripts/version.sh
          bash scripts/version.sh sync

      - name: 恢复固定签名密钥
        working-directory: android
        run: |
          # ★ 关键：必须用**固定的**密钥，否则每次构建签名不同，
          #    用户装过旧版后无法覆盖安装（报"签名不一致"）。
          #    密钥以 base64 存于 release-keys/，不属于秘密——
          #    Android 的 APK 签名证书本身就是公开可见的。
          mkdir -p keystore
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "使用仓库 Secret 中的密钥"
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > keystore/smsatbox.jks
          elif [ -f ../release-keys/smsatbox-keystore.b64 ]; then
            echo "使用仓库内置的固定密钥"
            base64 -d ../release-keys/smsatbox-keystore.b64 > keystore/smsatbox.jks
          else
            echo "::error::找不到签名密钥，无法保证覆盖安装"
            exit 1
          fi

          echo "密钥文件大小: $(stat -c%s keystore/smsatbox.jks) bytes"
          keytool -list -keystore keystore/smsatbox.jks -storepass smsatbox | grep -E "Keystore type|SHA" || true

      - name: 缓存 Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: 构建 Release APK
        working-directory: android
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt
          export PATH="/opt/gradle-8.9/bin:$PATH"
          gradle :app:assembleRelease --no-daemon --stacktrace

      - name: 重命名 APK（含平台与版本）
        id: apk
        run: |
          APK="$(find android/app/build/outputs/apk/release -name '*.apk' | head -n1)"
          [ -n "$APK" ] || { echo "::error::未找到 APK 产物"; ls -R android/app/build/outputs; exit 1; }
          mkdir -p dist
          OUT="dist/smsatbox-android-${{ needs.prepare.outputs.android_version }}.apk"
          cp "$APK" "$OUT"
          echo "path=$OUT" >> "$GITHUB_OUTPUT"
          ls -lh "$OUT"

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: ${{ steps.apk.outputs.path }}
          retention-days: 7

  # ═══════════════════════════════════════════════════════════════
  # 3. 构建 Windows EXE
  # ═══════════════════════════════════════════════════════════════
  build-exe:
    name: 构建 EXE
    runs-on: windows-latest
    needs: prepare
    steps:
      - uses: actions/checkout@v4

      - name: 设置 .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: 同步版本号到源码
        shell: bash
        run: |
          chmod +x scripts/version.sh
          bash scripts/version.sh sync

      - name: 构建单文件 EXE
        shell: pwsh
        working-directory: windows
        run: |
          $version = "${{ needs.prepare.outputs.windows_version }}"
          Write-Host "Windows 版本: $version"

          dotnet restore SmsatBox.sln
          dotnet publish SmsatBox.Desktop/SmsatBox.Desktop.csproj `
            -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:Version=$version `
            -p:AssemblyVersion="$version.0" `
            -p:FileVersion="$version.0" `
            -o ../dist/exe

          if (-not (Test-Path "../dist/exe/SmsatBox.exe")) {
            Write-Error "未找到 EXE 产物"; Get-ChildItem -Recurse ../dist; exit 1
          }

      - name: 重命名 EXE（含平台与版本）
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $out = "dist/smsatbox-windows-${{ needs.prepare.outputs.windows_version }}.exe"
          Copy-Item "dist/exe/SmsatBox.exe" $out
          Get-Item $out | Select-Object Name, @{N='SizeMB';E={[math]::Round($_.Length/1MB,2)}}

      - name: 上传 EXE 产物
        uses: actions/upload-artifact@v4
        with:
          name: exe
          path: dist/smsatbox-windows-${{ needs.prepare.outputs.windows_version }}.exe
          retention-days: 7

  # ═══════════════════════════════════════════════════════════════
  # 4. 发布 Release
  # ═══════════════════════════════════════════════════════════════
  release:
    name: 发布 Release
    runs-on: ubuntu-latest
    needs: [prepare, build-apk, build-exe]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 下载全部产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: 整理产物
        run: |
          mkdir -p release-assets
          find artifacts -type f \( -name '*.apk' -o -name '*.exe' \) -exec cp {} release-assets/ \;
          echo "=== 待发布文件 ==="
          ls -lh release-assets/

      - name: 计算校验和
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS.txt 2>/dev/null || true
          cat SHA256SUMS.txt || true

      - name: 生成 Release 说明
        env:
          AV: ${{ needs.prepare.outputs.android_version }}
          AC: ${{ needs.prepare.outputs.android_code }}
          WV: ${{ needs.prepare.outputs.windows_version }}
          SV: ${{ needs.prepare.outputs.server_version }}
          TAG: ${{ needs.prepare.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          base="https://github.com/${REPO}/releases/download/${TAG}"

          PREV="$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo '')"
          if [ -n "$PREV" ]; then
            PREV_LINE="对比上次发布：[${PREV} → ${TAG}](https://github.com/${REPO}/compare/${PREV}...${TAG})"
            LOG_RANGE="${PREV}..HEAD"
          else
            PREV_LINE="首次发布"
            LOG_RANGE="HEAD"
          fi

          {
            echo "## SMSATBOX 发布 $TAG"
            echo ""
            echo "### 各端版本"
            echo ""
            echo "| 端 | 版本 | 说明 |"
            echo "| --- | --- | --- |"
            echo "| 📱 **Android** | \`${AV}\` (code ${AC}) | 独立版本号 |"
            echo "| 🖥️ **Windows** | \`${WV}\` | 独立版本号 |"
            echo "| ☁️ **Server** | \`${SV}\` | 独立发布，走 Docker Hub |"
            echo ""
            echo "> APK 与 EXE 版本号各自独立演进，共用一个 Release 归档。"
            echo "> 客户端升级时只比对**自己那个安装包文件名里的版本**，互不干扰。"
            echo ""
            echo "${PREV_LINE}"
            echo ""
            echo "### 本次变更"
            echo ""
            git log ${LOG_RANGE} --pretty=format:"- %s (%h)" --no-merges | head -n 40 | sed 's/@/＠/g' || true
            echo ""
            echo ""
            echo "---"
            echo ""
            echo "## 下载"
            echo ""
            echo "| 平台 | 文件 | 说明 |"
            echo "| --- | --- | --- |"
            echo "| 📱 **Android** | [smsatbox-android-${AV}.apk](${base}/smsatbox-android-${AV}.apk) | 手机装这个 |"
            echo "| 🖥️ **Windows** | [smsatbox-windows-${WV}.exe](${base}/smsatbox-windows-${WV}.exe) | 单文件，双击即用 |"
            echo ""
            echo "> 两端启动后可在「设置 → 检查更新」独立升级，"
            echo "> 直连 GitHub Release API 下载，**不经过 Server 中转**。"
            echo ""
            echo "---"
            echo ""
            echo "## 关于本项目"
            echo ""
            echo "短信 / 未接来电 多卡提醒盒子："
            echo "ESP32-S3 硬件端接双 4G 模组，短信与来电经云端中转平台推送到手机与桌面。"
            echo ""
            echo "- **边缘极简**：设备只持有一个 Device_Token，不存任何用户凭据"
            echo "- **鉴权隔离**：用户、权限、卡槽可见性全部由 Server 数据库裁决"
            echo "- **双轨服务**：设备既是局域网 Web 服务器，也是公网平台客户端"
            echo ""
            echo "<details>"
            echo "<summary>文件校验（SHA256）</summary>"
            echo ""
            echo '```'
            cat release-assets/SHA256SUMS.txt 2>/dev/null || echo "（未生成）"
            echo '```'
            echo ""
            echo "</details>"
          } > RELEASE_BODY.md

          cat RELEASE_BODY.md

      - name: 新建 Release
        if: needs.prepare.outputs.strategy == 'create'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ needs.prepare.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --title "SMSATBOX ${{ needs.prepare.outputs.tag }}" \
            --notes-file RELEASE_BODY.md \
            --latest \
            release-assets/*

      - name: 覆盖已存在的 Release
        if: needs.prepare.outputs.strategy == 'overwrite'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.prepare.outputs.tag }}"
          gh release view "$TAG" --repo "${{ github.repository }}" --json assets \
            -q '.assets[].name' | while read -r name; do
              [ -n "$name" ] && gh release delete-asset "$TAG" "$name" \
                --repo "${{ github.repository }}" --yes || true
            done
          gh release edit "$TAG" \
            --repo "${{ github.repository }}" \
            --title "SMSATBOX $TAG" \
            --notes-file RELEASE_BODY.md \
            --latest
          gh release upload "$TAG" release-assets/* \
            --repo "${{ github.repository }}" --clobber

      - name: 发布结果
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.prepare.outputs.tag }}"
          URL="$(gh release view "$TAG" --repo "${{ github.repository }}" --json url -q .url)"
          {
            echo "### Release 已发布"
            echo ""
            echo "- Android: \`${{ needs.prepare.outputs.android_version }}\`"
            echo "- Windows: \`${{ needs.prepare.outputs.windows_version }}\`"
            echo "- Server:  \`${{ needs.prepare.outputs.server_version }}\`"
            echo "- 策略: ${{ needs.prepare.outputs.strategy }}"
            echo ""
            echo "**地址**: $URL"
          } >> "$GITHUB_STEP_SUMMARY"
